      node.setAttribute('aria-busy', 'true');
      node.textContent = busyLabel;
    } else if (!busy && node.hasAttribute('aria-busy')) {
      node.disabled = node.dataset.previousDisabled === 'true';
      node.removeAttribute('aria-busy');
      node.style.minWidth = node.dataset.previousMinWidth || '';
      node.textContent = label;
    }
  };
  return node;
}

function Alert({ title, message, tone = 'info', dismissible = false }) {

    el('span', { className: 'alert__symbol', 'aria-hidden': 'true' }, tone === 'success' ? '✓' : '!'),
    el('div', {}, title ? el('strong', {}, title) : null, message ? el('p', {}, message) : null));
  if (dismissible) node.append(Button({ label: '닫기', variant: 'text', size: 'small', onClick: () => node.remove() }));

function Field({ label, name, value = '', type = 'text', hint = '', required = false, placeholder = '', options }) {
  const id = uid('field');
  const control = el(options ? 'select' : type === 'textarea' ? 'textarea' : 'input', {
    id, name, className: 'field-control', required, placeholder,
    type: options || type === 'textarea' ? undefined : type,
  });
  if (options) for (const item of options) control.append(el('option', { value: item.value }, item.label));
  control.value = value;
  const help = hint ? el('p', { id: `${id}-hint`, className: 'field__hint' }, hint) : null;
  const error = el('p', { id: `${id}-error`, className: 'field__error', hidden: true });
  const node = el('div', { className: 'field' },
    el('label', { for: id }, label, required ? el('span', { className: 'field__required' }, '필수') : null), control, help, error);
  node.control = control;
  node.setError = (message = '') => {
    error.textContent = message;
    error.hidden = !message;
    control.setAttribute('aria-invalid', String(Boolean(message)));
    const descriptions = [help?.id, message ? error.id : null].filter(Boolean);
    if (descriptions.length) control.setAttribute('aria-describedby', descriptions.join(' '));
    else control.removeAttribute('aria-describedby');
  };
  node.setError();
  return node;
}


function Tabs({ label, items, onChange }) {
  const id = uid('tabs');
  const buttons = [];
  const panels = [];
  const bar = el('div', { role: 'tablist', 'aria-label': label, className: 'tabs__bar' });
  function activate(index, moveFocus = false) {
    buttons.forEach((button, i) => {
      button.setAttribute('aria-selected', String(i === index));
      button.tabIndex = i === index ? 0 : -1;
      panels[i].hidden = i !== index;
    });
    if (moveFocus) buttons[index].focus();
    onChange?.(items[index].value);
  }
  items.forEach((item, i) => {
    const panel = el('section', { id: `${id}-panel-${i}`, role: 'tabpanel', 'aria-labelledby': `${id}-tab-${i}`, tabIndex: 0, className: 'tabs__panel' }, item.content);
    const button = el('button', {
      id: `${id}-tab-${i}`, type: 'button', role: 'tab', 'aria-controls': panel.id,
      onClick: () => activate(i),
      onKeydown: (event) => {
        const targets = { ArrowRight: (i + 1) % items.length, ArrowLeft: (i + items.length - 1) % items.length, Home: 0, End: items.length - 1 };
        if (event.key in targets) { event.preventDefault(); activate(targets[event.key], true); }
      },
    }, item.label);
    buttons.push(button); panels.push(panel); bar.append(button);
  });
  const node = el('div', { className: 'tabs' }, bar, panels);
  activate(0);
  return node;
}



function Dialog({ title, description, content, confirmLabel = '확인', onConfirm, danger = false }) {
  const id = uid('dialog');
  let trigger;
  const cancel = Button({ label: '취소', variant: 'secondary', onClick: () => node.close() });
  const confirm = Button({ label: confirmLabel, variant: danger ? 'danger' : 'primary', onClick: async () => {
    confirm.setBusy(true);
    try { await onConfirm?.(); node.close(); }
    catch { feedback.textContent = '작업을 완료하지 못했습니다. 다시 시도해주세요.'; }
    finally { confirm.setBusy(false); }
  } });
  const feedback = el('p', { role: 'alert', className: 'field__error' });
  const node = el('dialog', { className: 'dialog', 'aria-labelledby': `${id}-title`, 'aria-describedby': description ? `${id}-description` : undefined },
    el('h2', { id: `${id}-title` }, title),
    description ? el('p', { id: `${id}-description` }, description) : null,
    content, feedback, el('div', { className: 'button-group' }, cancel, confirm));
  // 기본 대화상자를 사용해 초점 제한과 Escape 닫기를 브라우저에 맡긴다.
  node.openDialog = () => { trigger = document.activeElement; node.showModal(); cancel.focus(); };
  node.addEventListener('close', () => trigger?.focus());
  return node;
}

      onChange?.(language);

}




function Header({ name, links, active, language = 'ko', onLanguageChange }) {
  const en = language === 'en';
  const id = uid('navigation');
  const nav = el('nav', { id, className: 'site-nav', 'aria-label': en ? 'Main navigation' : '주요 메뉴' },
    links.map((link) => el('a', { href: safeHref(link.href), 'aria-current': link.id === active ? 'page' : undefined }, link.label)));
  const menu = Button({ label: en ? 'Menu' : '메뉴', variant: 'secondary', size: 'small', onClick: () => {
    const open = menu.getAttribute('aria-expanded') !== 'true';
    menu.setAttribute('aria-expanded', String(open));
    nav.classList.toggle('is-open', open);
  } });
  menu.classList.add('menu-toggle');
  menu.setAttribute('aria-controls', id);
  menu.setAttribute('aria-expanded', 'false');
  nav.addEventListener('keydown', (event) => {
    if (event.key === 'Escape') { nav.classList.remove('is-open'); menu.setAttribute('aria-expanded', 'false'); menu.focus(); }
  });
  nav.addEventListener('click', (event) => {
    if (event.target.closest('a')) { nav.classList.remove('is-open'); menu.setAttribute('aria-expanded', 'false'); }
  });
  return el('header', { className: 'site-header' },
    el('a', { href: '#main', className: 'skip-link' }, en ? 'Skip to content' : '본문 바로가기'),
    el('div', { className: 'container header-inner' },
      el('a', { href: '#intro', className: 'site-name' }, name),
      el('div', { className: 'header-actions' }, LanguageSwitch({ value: language, onChange: onLanguageChange }), menu), nav));
}

  const year = Field({ label: en ? 'Year' : '연도', name: 'year', value: values.year, options: [{ label: en ? 'All years' : '전체 연도', value: '' }, ...years.map((value) => ({ label: String(value), value: String(value) }))] });
  const topic = Field({ label: en ? 'Research area' : '연구 분야', name: 'topic', value: values.topic, options: [{ label: en ? 'All areas' : '전체 분야', value: '' }, ...topics.map((value) => ({ label: value, value }))] });

  const apply = () => onSearch({ q: search.control.value, year: year.control.value, topic: topic.control.value });

function Pagination({ page = 1, total, pageSize = 20, onChange, language = 'ko' }) {
  const count = Math.ceil(total / pageSize);
  if (count < 2) return el('div');
  const node = el('nav', { className: 'pagination', 'aria-label': language === 'ko' ? '결과 페이지' : 'Result pages' });
  node.append(Button({ label: language === 'ko' ? '이전' : 'Previous', variant: 'secondary', size: 'small', disabled: page === 1, onClick: () => onChange(page - 1) }));
  for (let i = 1; i <= count; i++) {
    const button = Button({ label: String(i), size: 'small', variant: page === i ? 'primary' : 'text', onClick: () => onChange(i) });
    button.setAttribute('aria-label', language === 'ko' ? `${i}페이지` : `Page ${i}`);
    if (page === i) button.setAttribute('aria-current', 'page');
    node.append(button);
  }
  node.append(Button({ label: language === 'ko' ? '다음' : 'Next', variant: 'secondary', size: 'small', disabled: page === count, onClick: () => onChange(page + 1) }));
  return node;
}

// 주소의 검색 조건을 단일 상태로 사용해 새로고침과 뒤로 가기를 지원한다.
function updateUrl(changes) {
  const url = new URL(location.href);
  for (const [key, value] of Object.entries(changes)) {
    if (value === '' || value === null) url.searchParams.delete(key);
    else url.searchParams.set(key, String(value));
  }
  queryState = new URLSearchParams(url.search);
  // 대화 안의 제한된 미리보기에서는 주소 변경 없이 검색 상태를 유지한다.
  try { history.pushState(null, '', url); }
  catch (error) { if (error.name !== 'SecurityError') throw error; }
}

function makeLibrary() {
  const root = el('div');

    const values = { q: query.get('q') || '', year: query.get('year') || '', topic: query.get('topic') || '' };
    const rows = publications.filter((paper) => (!values.year || String(paper.year) === values.year)
      && (!values.topic || paper.tags.includes(values.topic))
      && `${paper.title} ${paper.journal} ${paper.tags.join(' ')}`.toLowerCase().includes(values.q.trim().toLowerCase()));
    const page = Math.min(Math.max(1, Number.parseInt(query.get('page'), 10) || 1), Math.max(1, Math.ceil(rows.length / 20)));
    const apply = (changes) => { updateUrl(changes); render(true); };

function makeEditor() {

    fields[value] = field;
    field.control.addEventListener('input', () => { drafts[value] = field.control.value; field.setError(); });
    return { value, label, content: field };
  }) });
  function validate() {
    let valid = true;
    for (const key of Object.keys(fields)) {
      const empty = !fields[key].control.value.trim();
      fields[key].setError(empty ? (key === 'ko' ? '자기소개를 입력해주세요.' : 'Please enter a biography.') : '');

        const index = key === 'ko' ? 0 : 1;

    return valid;
